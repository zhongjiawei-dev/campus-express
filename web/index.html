<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校园快递代取</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app" v-cloak>
  <!-- 登录 -->
  <div class="login-page" v-if="!token">
    <div class="login-brand">
      <h1>校园快递代取</h1>
      <p>站点代取 · 送到宿舍 · 全程可追踪</p>
    </div>
    <div class="login-card">
      <h2>选择演示身份</h2>
      <p class="hint">演示环境用固定身份登录；接入账号密码或学校统一身份认证后，这里替换为真实登录。</p>
      <div class="role-option" @click="loginAs('student')">
        <div>
          <div class="name">我是学生 · 下单取件</div>
          <div class="desc">林同学，钱包余额 100 元，含 1 条待接单订单</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="role-option" @click="loginAs('courier')">
        <div>
          <div class="name">我是代取员 · 接单赚钱</div>
          <div class="desc">周学长，已通过实名认证，可进入接单大厅</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="muted" v-if="loginLoading">正在登录…</div>
      <div class="muted" v-if="loginError" style="color:#D9480F">{{ loginError }}</div>
    </div>
  </div>

  <template v-else>
    <header class="topbar">
      <div>
        <div class="title">{{ pageTitle }}</div>
        <div class="sub">{{ nickname }} · {{ role === 'COURIER' ? '认证代取员' : '在校学生' }}</div>
      </div>
      <div class="role-tag">{{ role === 'COURIER' ? '代取员端' : '学生端' }}</div>
    </header>

    <main class="content">
      <!-- 首页下单 -->
      <section v-if="view === 'home'">
        <div class="card">
          <div class="steps">
            <div class="dot" :class="{ active: step >= 1 }">1</div>
            <div class="line"></div>
            <div class="dot" :class="{ active: step >= 2 }">2</div>
            <div class="line"></div>
            <div class="dot" :class="{ active: step >= 3 }">3</div>
            <div class="muted" style="margin-left:6px">
              {{ step === 1 ? '选择快递' : step === 2 ? '填写信息' : '确认支付' }}
            </div>
          </div>

          <template v-if="step === 1">
            <div class="type-grid">
              <div v-for="item in types" :key="item.value" class="type-card"
                   :class="{ active: form.orderType === item.value }"
                   @click="form.orderType = item.value">
                <div class="name">{{ item.name }}</div>
                <div class="desc">{{ item.desc }}</div>
                <div class="extra" v-if="item.extra > 0">+{{ item.extra }} 元</div>
              </div>
            </div>

            <label class="form-label">快递站点</label>
            <el-select v-model="form.stationId" placeholder="选择站点" style="width:100%">
              <el-option v-for="s in stations" :key="s.id" :label="s.name" :value="s.id"></el-option>
            </el-select>

            <label class="form-label">取件码</label>
            <el-input v-model="form.pickupCode" maxlength="8" placeholder="4-8 位数字"></el-input>
            <div class="muted" style="margin-top:6px">取件码仅用于代取员取件核验，平台加密存储。</div>

            <div class="actions">
              <el-button type="primary" @click="nextStep">下一步</el-button>
            </div>
          </template>

          <template v-if="step === 2">
            <label class="form-label">预估重量：{{ (form.weight / 1000).toFixed(1) }} kg</label>
            <el-slider v-model="form.weight" :min="500" :max="15000" :step="500"></el-slider>
            <div class="muted">首重 3kg 内免加价，超出每 1kg 加 1 元。</div>

            <label class="form-label">预约取件时间</label>
            <el-date-picker v-model="form.expectStart" type="datetime" placeholder="开始时间"
                            format="yyyy-MM-dd HH:mm" style="width:100%"></el-date-picker>
            <div style="height:8px"></div>
            <el-date-picker v-model="form.expectEnd" type="datetime" placeholder="结束时间"
                            format="yyyy-MM-dd HH:mm" style="width:100%"></el-date-picker>

            <label class="form-label">收货地址</label>
            <el-select v-model="form.addressId" placeholder="选择地址" style="width:100%">
              <el-option v-for="a in addresses" :key="a.id"
                         :label="a.campus + ' ' + a.building + ' ' + a.roomMask"
                         :value="a.id"></el-option>
            </el-select>
            <div class="muted" style="margin-top:6px" v-if="!addresses.length">
              还没有地址，可在「我的」页添加演示地址。
            </div>

            <label class="form-label">备注</label>
            <el-input v-model="form.remark" maxlength="50" placeholder="如：放门口、轻拿轻放"></el-input>

            <div class="row-line" style="margin-top:10px">
              <div>
                <div>丢件保价</div>
                <div class="muted">费率 0.8%，最低 0.5 元</div>
              </div>
              <el-switch v-model="form.insured"></el-switch>
            </div>
            <div v-if="form.insured">
              <label class="form-label">声明价值（元）</label>
              <el-input-number v-model="form.declaredValue" :min="0" :max="2000" :step="100"
                               style="width:100%"></el-input-number>
            </div>

            <div class="actions">
              <el-button @click="prevStep">上一步</el-button>
              <el-button type="primary" :loading="quoteLoading" @click="nextStep">查看报价</el-button>
            </div>
          </template>

          <template v-if="step === 3 && quote">
            <div class="quote-line"><span>基础配送费</span><span>¥{{ quote.baseFee }}</span></div>
            <div class="quote-line"><span>重量加价</span><span>¥{{ quote.weightFee }}</span></div>
            <div class="quote-line"><span>距离加价（{{ quote.distanceM }} 米）</span><span>¥{{ quote.distanceFee }}</span></div>
            <div class="quote-line" v-if="quote.peak"><span>高峰时段溢价</span><span>¥{{ quote.peakFee }}</span></div>
            <div class="quote-line" v-if="quote.typeExtraFee > 0"><span>品类附加</span><span>¥{{ quote.typeExtraFee }}</span></div>
            <div class="quote-line" v-if="quote.insureFee > 0"><span>保价费</span><span>¥{{ quote.insureFee }}</span></div>
            <div class="quote-total"><span>合计</span><span class="price">¥{{ quote.totalFee }}</span></div>
            <div class="muted" style="margin-top:8px">规则版本：{{ quote.ruleNo }}；支付方式：钱包余额（演示支付）</div>

            <div class="actions">
              <el-button @click="prevStep">上一步</el-button>
              <el-button type="primary" :loading="submitLoading" @click="submitOrder">
                确认支付 ¥{{ quote.totalFee }}
              </el-button>
            </div>
          </template>
        </div>
      </section>

      <!-- 订单列表 -->
      <section v-if="view === 'orders'">
        <div class="card" style="padding:8px 14px">
          <div style="display:flex;gap:8px">
            <div v-for="tab in orderTabs" :key="tab.key"
                 class="type-card" style="flex:1;text-align:center;padding:8px 0"
                 :class="{ active: orderTab === tab.key }"
                 @click="switchOrderTab(tab.key)">{{ tab.name }}</div>
          </div>
        </div>

        <div v-if="orders.length === 0 && !ordersLoading" class="empty">暂无订单</div>
        <div v-for="order in orders" :key="order.orderNo" class="order-card" @click="openDetail(order.orderNo)">
          <div class="head">
            <span>{{ order.typeText }} · {{ (order.weightGram / 1000).toFixed(1) }}kg</span>
            <span class="status">{{ order.statusText }}</span>
          </div>
          <div class="meta">订单号 {{ order.orderNo }}</div>
          <div class="meta">{{ fmt(order.createdAt) }}<span v-if="order.distanceM"> · 约 {{ order.distanceM }} 米</span></div>
          <div class="foot">
            <span class="code">取件码 {{ order.pickupCodeMask }}</span>
            <span class="price">¥{{ order.totalFee }}</span>
          </div>
        </div>
        <div v-if="ordersLoading" class="loading-more">加载中…</div>
        <div v-else-if="orders.length > 0" class="loading-more">
          <el-button v-if="ordersHasMore" size="mini" @click="loadOrders(false)">加载更多</el-button>
          <span v-else>已经到底了</span>
        </div>
      </section>

      <!-- 接单大厅 -->
      <section v-if="view === 'hall'">
        <div class="card" v-if="role !== 'COURIER'">
          <div class="card-title">尚未成为代取员</div>
          <div class="muted">在「我的」页提交实名认证，审核通过后即可接单。</div>
          <div class="actions">
            <el-button type="primary" @click="go('mine')">去认证</el-button>
          </div>
        </div>

        <template v-else>
          <div class="card" style="padding:8px 12px">
            <div style="display:flex;gap:6px">
              <div v-for="sort in hallSorts" :key="sort.key"
                   class="type-card" style="flex:1;text-align:center;padding:7px 0"
                   :class="{ active: hallSort === sort.key }"
                   @click="switchHallSort(sort.key)">{{ sort.name }}</div>
            </div>
          </div>

          <div v-if="hallOrders.length === 0 && !hallLoading" class="empty">当前没有待接订单</div>
          <div v-for="order in hallOrders" :key="order.orderNo" class="order-card" @click="openDetail(order.orderNo)">
            <div class="head">
              <span>{{ order.stationName }}</span>
              <span class="price">¥{{ order.totalFee }}</span>
            </div>
            <div class="meta">{{ order.typeText }} · {{ (order.weightGram / 1000).toFixed(1) }}kg · 约 {{ order.distanceM }} 米</div>
            <div class="meta">预约 {{ fmt(order.expectStart) }} 至 {{ fmt(order.expectEnd) }}</div>
            <div class="meta" v-if="order.remark">备注：{{ order.remark }}</div>
            <div class="actions">
              <el-button type="primary" size="small" @click.stop="grab(order.orderNo)">立即抢单</el-button>
            </div>
          </div>
        </template>
      </section>

      <!-- 订单详情 -->
      <section v-if="view === 'detail'">
        <div style="margin-bottom:10px">
          <el-button size="small" @click="go(lastView === 'detail' ? 'orders' : lastView)">返回</el-button>
        </div>

        <template v-if="detail">
          <div class="detail-head">
            <div class="status">{{ detail.statusText }}</div>
            <div class="no">订单号 {{ detail.order.orderNo }}</div>
            <div class="fee">¥{{ detail.order.totalFee }}</div>
          </div>

          <div class="card">
            <div class="card-title">配送信息</div>
            <div class="row-line"><span>快递站点</span><span>{{ detail.stationName }}</span></div>
            <div class="row-line"><span>快递类型</span><span>{{ detail.order.typeText }} {{ (detail.order.weightGram / 1000).toFixed(1) }}kg</span></div>
            <div class="row-line"><span>取件码</span><span>{{ detail.order.pickupCodeMask }}</span></div>
            <div class="row-line"><span>预约时间</span><span>{{ fmt(detail.order.expectStart) }} 至 {{ fmt(detail.order.expectEnd) }}</span></div>
            <div class="row-line" v-if="detail.order.remark"><span>备注</span><span>{{ detail.order.remark }}</span></div>
          </div>

          <div class="card">
            <div class="card-title">收货地址</div>
            <div style="font-weight:600">{{ detail.address.contactName }} {{ detail.address.phoneMask }}</div>
            <div class="muted" style="margin-top:4px">
              {{ detail.address.campus }} {{ detail.address.building }} {{ detail.address.room }}
            </div>
            <div class="muted">{{ detail.address.detail }}</div>
            <div class="muted" v-if="detail.courierName">代取员：{{ detail.courierName }}</div>
          </div>

          <div class="card">
            <div class="card-title">状态流转</div>
            <el-timeline>
              <el-timeline-item v-for="log in logs" :key="log.id" :timestamp="fmt(log.createdAt)" color="#1F7A5C">
                <div>{{ statusText[log.toStatus] }}</div>
                <div class="muted" v-if="log.remark">{{ log.remark }}</div>
              </el-timeline-item>
            </el-timeline>
            <div class="muted" v-if="logs.length === 0">暂无流转记录</div>
          </div>

          <div class="card" v-if="role === 'COURIER' && detail.order.status === 30">
            <div class="card-title">取件核验</div>
            <label class="form-label">取件码</label>
            <el-input v-model="pickupInput" maxlength="8" placeholder="向用户核对取件码"></el-input>
            <label class="form-label">拍照凭证（图片地址）</label>
            <el-input v-model="photoUrl" placeholder="https://..."></el-input>
            <div class="actions">
              <el-button type="primary" @click="pick">确认取件</el-button>
            </div>
          </div>

          <div class="card" v-if="role === 'COURIER' && detail.order.status === 40">
            <div class="card-title">送达凭证</div>
            <el-input v-model="photoUrl" placeholder="送达照片地址"></el-input>
            <div class="actions">
              <el-button type="primary" @click="deliver">确认送达</el-button>
            </div>
          </div>

          <div class="card" v-if="role === 'USER' && detail.order.status === 60">
            <div class="card-title">订单评价</div>
            <div v-if="myReview">
              <div class="row-line"><span>我的评分</span><span><el-rate v-model="myReview.score" disabled></el-rate></span></div>
              <div class="muted" v-if="myReview.tags">标签：{{ myReview.tags }}</div>
              <div class="muted" v-if="myReview.content">{{ myReview.content }}</div>
            </div>
            <div v-else>
              <div class="row-line"><span>评分</span><el-rate v-model="review.score"></el-rate></div>
              <el-checkbox-group v-model="review.tags">
                <el-checkbox label="准时送达"></el-checkbox>
                <el-checkbox label="态度好"></el-checkbox>
                <el-checkbox label="搬运稳"></el-checkbox>
              </el-checkbox-group>
              <el-input type="textarea" v-model="review.content" :rows="3" maxlength="200" show-word-limit placeholder="说说这次代取体验"></el-input>
              <el-checkbox v-model="review.anonymous" style="margin-top:8px">匿名评价</el-checkbox>
              <div class="actions">
                <el-button type="primary" @click="submitReview">提交评价</el-button>
              </div>
            </div>
          </div>

          <div class="card" v-if="role === 'USER'">
            <div class="card-title">订单操作</div>
            <div class="actions" style="flex-direction:column">
              <el-button v-if="detail.order.status === 10" type="primary" @click="pay">立即支付</el-button>
              <el-button v-if="[10,20,30].indexOf(detail.order.status) >= 0" @click="cancelOrder">取消订单</el-button>
              <el-button v-if="detail.order.status === 50" type="primary" @click="confirmReceive">确认收货</el-button>
              <el-button v-if="detail.order.status >= 40 && detail.order.status <= 60" @click="appeal">发起售后</el-button>
              <el-button v-if="[60,70,90].indexOf(detail.order.status) >= 0" @click="repeatOrder">再来一单</el-button>
            </div>
          </div>
        </template>
        <div v-else class="empty">加载中…</div>
      </section>

      <!-- 我的 -->
      <section v-if="view === 'mine'">
        <div class="profile-card">
          <div>
            <div class="name">{{ nickname }}</div>
            <div class="role">{{ role === 'COURIER' ? '认证代取员 · 接单中' : '在校学生' }}</div>
          </div>
          <div>
            <el-button size="mini" plain @click="logout">退出</el-button>
          </div>
        </div>

        <div class="card">
          <div class="wallet-grid">
            <div>
              <div class="label">钱包余额</div>
              <div class="value">¥{{ wallet ? wallet.balance : 0 }}</div>
            </div>
            <div>
              <div class="label">累计收入</div>
              <div class="value">¥{{ wallet ? wallet.totalIncome : 0 }}</div>
            </div>
            <div>
              <div class="label">今日收入</div>
              <div class="value">¥{{ todayIncome }}</div>
            </div>
          </div>
          <div class="actions">
            <el-button size="small" @click="go('orders')">我的订单</el-button>
            <el-button v-if="role === 'COURIER'" size="small" type="primary" @click="go('hall')">接单大厅</el-button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">演示身份切换</div>
          <div class="muted">用于答辩演示学生端与代取员端的完整闭环。</div>
          <div class="actions">
            <el-button size="small" @click="loginAs('student')">切换为学生</el-button>
            <el-button size="small" @click="loginAs('courier')">切换为代取员</el-button>
          </div>
        </div>

        <div class="card" v-if="role !== 'COURIER'">
          <div class="card-title">成为代取员</div>
          <div class="muted">完成实名认证后可接单赚配送费，平台抽成 10%。</div>
          <div class="actions">
            <el-button type="primary" size="small" @click="applyCourier">提交认证资料</el-button>
          </div>
        </div>

        <div class="card" v-if="courier">
          <div class="card-title">代取员档案</div>
          <div class="row-line"><span>认证状态</span><span class="tag">{{ courier.auditStatus === 2 ? '已通过' : '审核中' }}</span></div>
          <div class="row-line"><span>服务时段</span><span>{{ courier.serviceStart }} - {{ courier.serviceEnd }}</span></div>
          <div class="row-line"><span>可接重量</span><span>{{ (courier.maxWeightGram / 1000).toFixed(1) }} kg</span></div>
          <div class="row-line"><span>服务评分</span><span>{{ courier.score }} 分 / 完成 {{ courier.finishedCnt }} 单</span></div>
        </div>

        <div class="card">
          <div class="card-title">收货地址</div>
          <div v-for="a in addresses" :key="a.id" style="padding:8px 0;border-bottom:1px solid #F2F3F5">
            <div>{{ a.building }} {{ a.roomMask }} <span class="tag" v-if="a.isDefault">默认</span></div>
            <div class="muted">{{ a.campus }} · {{ a.contactName }} {{ a.phoneMask }}</div>
          </div>
          <div class="muted" v-if="!addresses.length">还没有收货地址</div>
          <div class="actions">
            <el-button size="small" @click="addDemoAddress">添加演示地址</el-button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">消息通知 <span class="tag" v-if="unread > 0">{{ unread }}</span></div>
          <div v-for="msg in messages" :key="msg.id" class="msg-item">
            <div class="msg-head"><span>{{ msg.title }}</span><span class="time">{{ fmt(msg.createdAt) }}</span></div>
            <div class="body">{{ msg.content }}</div>
          </div>
          <div class="muted" v-if="!messages.length">暂无消息</div>
        </div>
      </section>
    </main>

    <nav class="tabbar">
      <div class="tab" :class="{ active: view === 'home' }" @click="go('home')">首页</div>
      <div class="tab" :class="{ active: view === 'orders' }" @click="go('orders')">订单</div>
      <div class="tab" :class="{ active: view === 'hall' }" @click="go('hall')">接单</div>
      <div class="tab" :class="{ active: view === 'mine' }" @click="go('mine')">我的</div>
    </nav>
  </template>
</div>

<script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>
<script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script>
  Vue.use(window.ELEMENT || window.ElementUI);
</script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
